version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        exclude-patterns:
          - github.com/smacker/go-tree-sitter
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /bench/memory
    schedule:
      interval: weekly
    # Disable routine version PRs; retain security updates.
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
