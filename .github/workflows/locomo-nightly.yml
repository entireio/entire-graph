name: locomo-nightly

# Nightly full LoCoMo (n=1540) for the entire-graph arm only.
#
# SECURITY MODEL — why an external contributor cannot trigger this, and why there
# is no long-lived credential in this repository:
#
#   * `schedule` fires ONLY on the default branch of THIS repository. A fork
#     cannot schedule a workflow in the upstream repo, so the nightly path is
#     unreachable from outside.
#   * `pull_request_target` is deliberately ABSENT. It is the one trigger that
#     hands repository secrets to code from a fork, and it is the standard
#     exfiltration route. Do not add it to this file.
#   * `workflow_dispatch` already requires write access and uses the reviewer-
#     protected `benchmark` environment. Scheduled runs use the separate
#     `benchmark-nightly` environment: main-only, but without required reviewers,
#     so a human gate cannot silently turn the nightly into a queued manual run.
#   * `if: github.repository == ...` stops the job even if this file is copied
#     into a fork that has its own schedule enabled.
#   * There is NO stored Azure API key. During the benchmark step the harness
#     obtains a short-lived GitHub OIDC assertion and exchanges it directly for a
#     short-lived Foundry data-plane bearer token. The token provider refreshes
#     both credentials as needed during the multi-hour run. Deleting the federated
#     credential or its resource-scoped role assignment revokes access.
#
#   Honest limit: `id-token: write` is job-wide, so code in any step can request a
#   GitHub OIDC assertion. CI installs the complete Python graph from exact wheel
#   hashes with dependency discovery disabled, and exposes the Entra identifiers
#   only to the benchmark step. Those controls prevent package drift; approved
#   runtime code still executes with identity access and must itself be trusted.
#
# One-time setup this workflow depends on is documented in
# bench/memory/RUNNING-LOCOMO.md ("Nightly CI").

on:
  schedule:
    # 06:00 UTC daily. The run takes ~2.5-3.5h, so it lands well before the
    # working day in either US or EU.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run (recorded in the run summary)"
        required: false
        default: "manual"

# Default deny. Each job re-grants only what it needs.
permissions: {}

# One benchmark at a time. A second run would contend for the same Foundry
# deployment quota and both would record throughput-shaped drops that look like
# arm weakness rather than contention.
concurrency:
  group: locomo-nightly
  cancel-in-progress: false

jobs:
  locomo:
    # Never run in a fork, even if this file is copied there with a schedule.
    if: github.repository == 'entireio/entire-graph'
    runs-on: ubuntu-latest
    # Last-resort ceiling for setup + benchmark + diagnostics. The benchmark
    # command has its own earlier graceful deadline so always() steps still get
    # time to summarize and upload completed per-question records.
    timeout-minutes: 330
    # Both environments are restricted to main and are separate immutable,
    # repository-ID-bound OIDC subjects.
    # `benchmark` has required reviewers; `benchmark-nightly` deliberately does
    # not. The Entra app trusts only these two exact subjects and has only MaaS
    # data-plane actions on the one Foundry resource (see the documented custom
    # role; the broader built-in Cognitive Services User role is not used).
    environment:
      name: ${{ github.event_name == 'schedule' && 'benchmark-nightly' || 'benchmark' }}
    permissions:
      contents: read
      id-token: write # OIDC token for Azure federation. Nothing else.

    steps:
      - name: Check out entire-graph
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.x"

      - name: Build entire-graph and put it on PATH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          go build -o "$HOME/bin/entire-graph" ./cmd/entire-graph
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/entire-graph" version || true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------------
      # Harness. The upstream benchmark is Apache-2.0 third-party code and is NOT
      # vendored here (see bench/memory/UPSTREAM.md); it is reconstructed from a
      # pinned commit plus this repo's patches, preserving the audited benchmark
      # configuration with the documented keyless-authentication successor.
      # ---------------------------------------------------------------------
      - name: Reconstruct the pinned upstream harness
        env:
          UPSTREAM_COMMIT: 4b61c5d31b9c668a12b4f5e78064248a02c82d2b
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mem0ai/memory-benchmarks.git "$HOME/mem0harness"
          cd "$HOME/mem0harness"
          git checkout --quiet "$UPSTREAM_COMMIT"

          # Content pin. UPSTREAM.md fixes this file's md5 at the pinned commit;
          # if it does not match, the clone is not what the published numbers ran
          # against and the run must not proceed.
          expected=abdbb9f272e4265153b7e3e71837007e
          actual=$(md5sum benchmarks/common/metrics.py | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::upstream metrics.py md5 $actual != pinned $expected"
            exit 1
          fi

          for p in "$GITHUB_WORKSPACE"/bench/memory/patches/000[1-4]-*.patch \
                   "$GITHUB_WORKSPACE"/bench/memory/patches/0006-*.patch; do
            git apply -p1 "$p"
          done
          cp "$GITHUB_WORKSPACE"/bench/memory/benchmarks/common/*.py benchmarks/common/
          cp "$GITHUB_WORKSPACE"/bench/memory/requirements-lock-py312.txt .

          python -m venv .venv
          .venv/bin/python -m pip install \
            --require-hashes --only-binary=:all: --no-deps \
            -r requirements-lock-py312.txt
          .venv/bin/python -m pip check

      - name: Fetch the LoCoMo dataset
        run: |
          set -euo pipefail
          cd "$HOME/mem0harness"
          mkdir -p datasets/locomo
          curl -fsSL -o datasets/locomo/locomo10.json \
            https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json
          # The audited dataset copy. LOCOMO-COMPARISON.md 6b pins this hash; a
          # different corpus is a different benchmark, so fail rather than score it.
          expected=79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4
          actual=$(sha256sum datasets/locomo/locomo10.json | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::locomo10.json sha256 $actual != pinned $expected"
            exit 1
          fi

      - name: Run LoCoMo (entire-graph arm, n=1540)
        id: benchmark
        # Backstop around the command-level graceful timeout below. This remains
        # below the job ceiling so later always() steps can still run.
        timeout-minutes: 285
        # Keep this as the first step that receives the Entra identifiers:
        # checkout, reconstruction, and dependency installation complete first.
        # `id-token: write` itself is job-wide; see the security note above.
        env:
          # These are identifiers, not credentials, and are deliberately scoped
          # to this step. With `id-token: write`, GitHub also injects the
          # ACTIONS_ID_TOKEN_REQUEST_* values used by the refreshable assertion
          # callback. The harness exchanges each assertion directly with Entra;
          # no azure/login session, Key Vault lookup, or model key is involved.
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          AZURE_AI_API_VERSION: "2024-05-01-preview"
          BENCH_STATE_ROOT: ${{ runner.temp }}/memarms/state
        run: |
          set -euo pipefail
          cd "$HOME/mem0harness"
          # SIGINT lets the harness finish in-flight records and write its
          # aggregate. If that stalls, SIGKILL after 10m still reserves job time
          # for partial-diagnostic collection and upload.
          mkdir -p results/locomo
          set +e
          timeout --signal=INT --kill-after=10m 270m \
            bash "$GITHUB_WORKSPACE/bench/memory/run_locomo.sh" entire
          benchmark_status=$?
          set -e
          printf '%s\n' "$benchmark_status" > results/locomo/benchmark_exit_status.txt
          exit "$benchmark_status"

      - name: Record partial diagnostic manifest
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome || 'not-run' }}
          DISPATCH_REASON: ${{ inputs.reason || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          results = Path.home() / "mem0harness" / "results" / "locomo"
          results.mkdir(parents=True, exist_ok=True)
          partial = results / "predicted_full_entire"
          question_files = sorted(partial.glob("conv*_q*.json"))
          corrupt = []
          for path in question_files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  corrupt.append(path.name)

          status_path = results / "benchmark_exit_status.txt"
          try:
              benchmark_exit_status = int(status_path.read_text(encoding="utf-8").strip())
          except (OSError, ValueError):
              benchmark_exit_status = None

          payload = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "benchmark_step_outcome": os.environ["BENCHMARK_OUTCOME"],
              "benchmark_exit_status": benchmark_exit_status,
              "benchmark_timed_out": benchmark_exit_status in (124, 137),
              "partial_results_dir": str(partial.relative_to(results)),
              "completed_question_files": len(question_files) - len(corrupt),
              "corrupt_question_files": corrupt,
              "aggregate_files": sorted(p.name for p in results.glob("locomo_results_*.json")),
              "timing_files": sorted(p.name for p in partial.glob("timings_phases_*.jsonl")),
              "ingestion_checkpoint_files": sorted(
                  p.name for p in partial.glob("_ingestion_*.json")
              ),
              "ingestion_progress_files": sorted(
                  p.name for p in partial.glob("_progress_*.json")
              ),
              "github_run_id": os.getenv("GITHUB_RUN_ID", ""),
              "github_run_attempt": os.getenv("GITHUB_RUN_ATTEMPT", ""),
              "github_sha": os.getenv("GITHUB_SHA", ""),
              "dispatch_reason": os.environ.get("DISPATCH_REASON", ""),
          }
          (results / "partial_diagnostics.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = os.getenv("GITHUB_STEP_SUMMARY")
          if summary and payload["dispatch_reason"]:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"Manual run reason: {payload['dispatch_reason']}\n\n")
          PY

      - name: Extract the score and gate the run
        if: always()
        run: |
          set -euo pipefail
          cd "$HOME/mem0harness"
          python "$GITHUB_WORKSPACE/bench/memory/ci/summarize_run.py" \
            --results-dir results/locomo \
            --run-id full_entire \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # A rerun keeps run_id but increments run_attempt. Artifact v4 names
          # are immutable within a workflow run, so include both to avoid a 409.
          name: locomo-${{ github.run_id }}-${{ github.run_attempt }}
          # Structured results/checkpoints only. Logs are excluded deliberately:
          # they are the most likely place for an environment dump to land, and
          # artifacts on a public repo are downloadable by anyone who can read it.
          path: |
            ~/mem0harness/results/locomo/locomo_results_*.json
            ~/mem0harness/results/locomo/predicted_full_entire/conv*_q*.json
            ~/mem0harness/results/locomo/predicted_full_entire/timings_phases_*.jsonl
            ~/mem0harness/results/locomo/predicted_full_entire/_ingestion_*.json
            ~/mem0harness/results/locomo/predicted_full_entire/_progress_*.json
            ~/mem0harness/results/locomo/benchmark_exit_status.txt
            ~/mem0harness/results/locomo/partial_diagnostics.json
          retention-days: 30
          if-no-files-found: warn
