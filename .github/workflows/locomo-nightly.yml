name: locomo-nightly

# Nightly full LoCoMo (n=1540) for the entire-graph arm only.
#
# SECURITY MODEL — why an external contributor cannot trigger this, and why there
# is no long-lived credential in this repository:
#
#   * `schedule` fires ONLY on the default branch of THIS repository. A fork
#     cannot schedule a workflow in the upstream repo, so the nightly path is
#     unreachable from outside.
#   * `pull_request_target` is deliberately ABSENT. It is the one trigger that
#     hands repository secrets to code from a fork, and it is the standard
#     exfiltration route. Do not add it to this file.
#   * `workflow_dispatch` already requires write access, and is additionally
#     gated by the `benchmark` environment (required reviewers + protected
#     branches), so a manual run needs a human approval recorded in the audit log.
#   * `if: github.repository == ...` stops the job even if this file is copied
#     into a fork that has its own schedule enabled.
#   * There is NO stored Azure API key. The job authenticates with a short-lived
#     GitHub OIDC token, exchanged by Azure for a short-lived access token via
#     workload identity federation, and reads the Foundry key out of Key Vault at
#     run time. Nothing persistent exists in GitHub to steal, the key rotates in
#     Key Vault without touching this repo, and deleting the federated credential
#     revokes access immediately.
#
#   Honest limit: the harness authenticates to Foundry with an `api-key` header
#   (see bench/memory/patches/0001-*.patch), so the key is necessarily in the job
#   environment while the benchmark runs. Any job with code execution can read
#   its own environment. That is why this workflow never runs untrusted code:
#   default branch only, no fork triggers, and every action pinned to a full
#   commit SHA so a compromised tag cannot introduce one.
#
# One-time setup this workflow depends on is documented in
# bench/memory/RUNNING-LOCOMO.md ("Nightly CI").

on:
  schedule:
    # 06:00 UTC daily. The run takes ~2.5-3.5h, so it lands well before the
    # working day in either US or EU.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run (recorded in the run summary)"
        required: false
        default: "manual"

# Default deny. Each job re-grants only what it needs.
permissions: {}

# One benchmark at a time. A second run would contend for the same Foundry
# deployment quota and both would record throughput-shaped drops that look like
# arm weakness rather than contention.
concurrency:
  group: locomo-nightly
  cancel-in-progress: false

jobs:
  locomo:
    # Never run in a fork, even if this file is copied there with a schedule.
    if: github.repository == 'entireio/entire-graph'
    runs-on: ubuntu-latest
    # The published runs took ~2.5-3.5h on a 32-vCPU host. GitHub's hard job
    # ceiling is 6h; this stops short of it so the run fails with its own
    # artifacts uploaded rather than being killed mid-write.
    timeout-minutes: 330
    # Gate: required reviewers and a main-only branch rule are configured on this
    # environment. It is also what scopes the Azure federated credential subject.
    environment: benchmark
    permissions:
      contents: read
      id-token: write # OIDC token for Azure federation. Nothing else.

    steps:
      - name: Check out entire-graph
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.x"

      - name: Build entire-graph and put it on PATH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          go build -o "$HOME/bin/entire-graph" ./cmd/entire-graph
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/entire-graph" version || true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------------
      # Credential: OIDC -> Azure -> Key Vault. No secret is stored in GitHub.
      # The three ids below are NOT secrets (they are directory identifiers, not
      # credentials) but are kept as repo variables so this file carries no
      # tenant-specific values.
      # ---------------------------------------------------------------------
      - name: Azure login (OIDC federation, no stored credential)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read Foundry key from Key Vault
        env:
          KEY_VAULT: ${{ vars.AZURE_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          key=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT" \
                  --name azure-ai-api-key \
                  --query value -o tsv)
          # Mask before the value can reach any later log line. Masking is a
          # backstop, not the control: the controls are "no fork code runs here"
          # and "the credential is revocable in Azure".
          echo "::add-mask::$key"
          echo "AZURE_AI_API_KEY=$key" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Harness. The upstream benchmark is Apache-2.0 third-party code and is NOT
      # vendored here (see bench/memory/UPSTREAM.md); it is reconstructed from a
      # pinned commit plus this repo's patches, so CI runs exactly the published
      # configuration.
      # ---------------------------------------------------------------------
      - name: Reconstruct the pinned upstream harness
        env:
          UPSTREAM_COMMIT: 4b61c5d31b9c668a12b4f5e78064248a02c82d2b
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mem0ai/memory-benchmarks.git "$HOME/mem0harness"
          cd "$HOME/mem0harness"
          git checkout --quiet "$UPSTREAM_COMMIT"

          # Content pin. UPSTREAM.md fixes this file's md5 at the pinned commit;
          # if it does not match, the clone is not what the published numbers ran
          # against and the run must not proceed.
          expected=abdbb9f272e4265153b7e3e71837007e
          actual=$(md5sum benchmarks/common/metrics.py | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::upstream metrics.py md5 $actual != pinned $expected"
            exit 1
          fi

          for p in "$GITHUB_WORKSPACE"/bench/memory/patches/000[1-4]-*.patch \
                   "$GITHUB_WORKSPACE"/bench/memory/patches/0006-*.patch; do
            git apply -p1 "$p"
          done
          cp "$GITHUB_WORKSPACE"/bench/memory/benchmarks/common/*.py benchmarks/common/

          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Fetch the LoCoMo dataset
        run: |
          set -euo pipefail
          cd "$HOME/mem0harness"
          mkdir -p datasets/locomo
          curl -fsSL -o datasets/locomo/locomo10.json \
            https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json
          # The audited dataset copy. LOCOMO-COMPARISON.md 6b pins this hash; a
          # different corpus is a different benchmark, so fail rather than score it.
          expected=79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4
          actual=$(sha256sum datasets/locomo/locomo10.json | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::locomo10.json sha256 $actual != pinned $expected"
            exit 1
          fi

      - name: Run LoCoMo (entire-graph arm, n=1540)
        env:
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          AZURE_AI_API_VERSION: "2024-05-01-preview"
          BENCH_STATE_ROOT: ${{ runner.temp }}/memarms/state
        run: |
          set -euo pipefail
          cd "$HOME/mem0harness"
          bash "$GITHUB_WORKSPACE/bench/memory/run_locomo.sh" entire

      - name: Extract the score and gate the run
        if: always()
        run: |
          set -euo pipefail
          cd "$HOME/mem0harness"
          python "$GITHUB_WORKSPACE/bench/memory/ci/summarize_run.py" \
            --results-dir results/locomo \
            --run-id full_entire \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locomo-${{ github.run_id }}
          # Result JSON only. Logs are excluded deliberately: they are the most
          # likely place for an environment dump to land, and artifacts on a
          # public repo are downloadable by anyone who can read the repo.
          path: |
            ~/mem0harness/results/locomo/locomo_results_*.json
          retention-days: 30
          if-no-files-found: warn
