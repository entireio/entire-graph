name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with: { go-version: "1.26.x" }
      - run: go vet ./...
      - run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with: { go-version: "1.26.x" }
      - run: go build ./...

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with: { go-version: "1.26.x" }
      # internal/sem runs ~550s on the Windows runner against Go's 600s default
      # per-package wall, with run-to-run swings of about 40s. That is 92% of an
      # unset budget: the suite was one ordinary new test away from failing for a
      # reason unrelated to the change that tripped it, which is what happened.
      # Name a budget with headroom instead of inheriting one nobody chose.
      - run: go test -timeout 30m ./...

  bm25-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check rank-bm25==0.2.2
      - run: python -m unittest bench.memory.benchmarks.common.test_bm25_client

  # The status line is a POSIX shell script with its own shell suite; `go test` never runs it.
  # No windows-latest: the script targets /bin/sh.
  statusline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with: { go-version: "1.26.x" }
      - run: go build -o entire-graph ./cmd/entire-graph
      - run: sh scripts/entire-graph-statusline_test.sh
