name: nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-tag:
    name: tag and release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create nightly tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(scripts/create-nightly-tag.sh) && EXIT=0 || EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            # HEAD is already tagged. That is the normal no-op when nothing has
            # landed since the last nightly -- but it is also what a RETRY sees
            # after a run pushed the tag and then failed or was cancelled
            # (cancel-in-progress makes that window real) before dispatching the
            # release. Telling those apart by whether the tag has a release
            # keeps the retry able to finish, instead of skipping that commit's
            # release permanently.
            EXISTING=$(git tag -l "v*-nightly.*.$(git rev-parse --short HEAD)" | sort | tail -1)
            if [ -n "$EXISTING" ] && ! gh release view "$EXISTING" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Nightly tag $EXISTING has no release yet — resuming its dispatch."
              echo "tag=$EXISTING" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping — HEAD already has a nightly tag and a release."
              echo "tag=" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          elif [ "$EXIT" -ne 0 ] || [ -z "$TAG" ]; then
            echo "::error::Failed to generate nightly tag"
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN does not trigger `on: push: tags`, so
      # dispatch the release explicitly. Dispatching with --ref <tag> sets
      # github.ref to refs/tags/<tag>, which is what release.yml's publish job
      # requires.
      - name: Build and publish the release for that tag
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
