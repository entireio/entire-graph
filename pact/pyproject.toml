[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "btw-pact"
version = "0.1.0"
description = "Confirmed intent, graph-selected checks, reproducible evidence for Entire"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "jinja2>=3.1.6,<4", "databricks-sdk>=0.60,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
btw-pact = "btw_pact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
btw_pact = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

